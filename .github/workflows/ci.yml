name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build image and run pytest inside it
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The image is what ships, so the suite runs inside it: the integration
      # tests need MFA, which only exists in the conda environment there.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          target: test
          load: true
          tags: voice-metrics-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: docker run --rm voice-metrics-api:test pytest -q -rs
