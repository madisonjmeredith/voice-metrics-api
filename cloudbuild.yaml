substitutions:
  _REGION: us-east4
  _REPOSITORY: voice-metrics-api
  _TAG: latest

steps:
  - name: gcr.io/cloud-builders/docker
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --platform=linux/amd64
      - --target=base
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/voice-metrics-api:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/voice-metrics-api:${_TAG}

options:
  machineType: E2_HIGHCPU_8

timeout: 3600s
